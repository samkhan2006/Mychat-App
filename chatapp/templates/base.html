<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <meta name="theme-color" content="#4f46e5">

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <title>{% block title %}ChatApp{% endblock %}</title>

    <style>
        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        a {
            text-decoration: none !important;
        }


        /* =========================================
           APP HEADER
        ========================================= */

        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;
            min-height: 72px;

            display: flex;
            align-items: center;

            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid #e8ebf2;

            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
        }

        .header-container {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        /* =========================================
           BRAND
        ========================================= */

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            color: #172033 !important;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;
            font-size: 19px;

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.22);
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .brand-name span {
            color: #4f46e5;
        }


        /* =========================================
           USER SECTION
        ========================================= */

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;
            color: #4f46e5;

            font-size: 14px;
            font-weight: 700;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            line-height: 1.25;
        }

        .welcome-text {
            font-size: 11px;
            color: #8a93a3;
        }

        .username {
            font-size: 13px;
            font-weight: 600;
            color: #273044;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .app-main {
            width: 100%;
            min-height: calc(100vh - 72px);

            padding: 35px 20px 50px;
        }

        .content-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }


        /* =========================================
           COMMON CARD
        ========================================= */

        .app-card {
            background: white;

            border: 1px solid #e8ebf2;
            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(15, 23, 42, 0.05);
        }


        /* =========================================
           CHAT MESSAGE
        ========================================= */

        .chat-message {
            width: fit-content;
            max-width: 75%;

            padding: 10px 14px;

            margin: 7px 0;

            border: none;
            border-radius: 14px;

            background: #eef2ff;
            color: #293246;

            font-size: 14px;
            line-height: 1.5;

            word-break: break-word;
        }

        .chat-message.text-right {
            margin-left: auto;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;

            border-bottom-right-radius: 4px;
        }

        .chat-message.text-left {
            margin-right: auto;

            background: #f1f3f7;

            border-bottom-left-radius: 4px;
        }

        .chat-message b {
            font-size: 11px;
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
            opacity: 0.75;
        }


        /* =========================================
           BOOTSTRAP OVERRIDES
        ========================================= */

        .btn {
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            border: none;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            box-shadow:
                0 6px 15px rgba(37, 99, 235, 0.18);
        }

        .btn-primary:hover {
            transform: translateY(-1px);

            box-shadow:
                0 9px 20px rgba(37, 99, 235, 0.25);
        }

        .btn-light {
            background: white;
            border: 1px solid #e1e5ed;
            color: #374151;
        }

        .btn-light:hover {
            background: #f8f9fc;
        }


        /* =========================================
           FORM CONTROLS
        ========================================= */

        .form-control {
            border-radius: 10px;
            border: 1px solid #dfe4ec;

            min-height: 46px;

            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.10) !important;
        }


        /* =========================================
           SCROLLBAR
        ========================================= */

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f3f7;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd1dc;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #aeb6c4;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 576px) {

            .app-header {
                min-height: 62px;
            }

            .header-container {
                padding: 0 15px;
            }

            .brand-icon {
                width: 37px;
                height: 37px;
                border-radius: 10px;
                font-size: 17px;
            }

            .brand-name {
                font-size: 17px;
            }

            .header-user {
                gap: 8px;
            }

            .user-avatar {
                width: 34px;
                height: 34px;
                font-size: 12px;
            }

            .user-info {
                display: none;
            }

            .app-main {
                min-height: calc(100vh - 62px);
                padding: 20px 12px 35px;
            }

            .chat-message {
                max-width: 88%;
                font-size: 13px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    {% block header %}

    <header class="app-header">

        <div class="header-container">

            <!-- Brand -->
            <a href="/" class="brand">

                <div class="brand-icon">
                    💬
                </div>

                <div class="brand-name">
                    Chat<span>App</span>
                </div>

            </a>


            <!-- User -->
            {% if user.is_authenticated %}

            <div class="header-user">

                <div class="user-info">

                    <span class="welcome-text">
                        Welcome back
                    </span>

                    <span class="username">
                        {{ user.username }}
                    </span>

                </div>

                <div class="user-avatar">
                    {{ user.username|first|upper }}
                </div>

            </div>

            {% endif %}

        </div>

    </header>

    {% endblock %}


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="app-main">

        <div class="content-container">

            {% block content %}
            {% endblock %}

        </div>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous">
    </script>

</body>

</html>
