

{% extends 'base.html' %}

{% block title %}Login | ChatApp{% endblock %}

{% block content %}

<style>
    .login-page {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #eef4ff 0%, #f8faff 50%, #eef8ff 100%);
    }

    .login-wrapper {
        width: 100%;
        max-width: 430px;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 22px;
        padding: 42px 38px;
        box-shadow: 0 20px 60px rgba(30, 64, 175, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .login-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 30px;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
    }

    .login-title {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #172033;
        margin-bottom: 8px;
    }

    .login-subtitle {
        text-align: center;
        color: #7b8496;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .login-form p {
        margin-bottom: 20px;
    }

    .login-form label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
    }

    .login-form input {
        width: 100%;
        height: 50px;
        padding: 0 15px;
        border: 1px solid #dce2ec;
        border-radius: 12px;
        background: #f9fafc;
        color: #1f2937;
        font-size: 15px;
        outline: none;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .login-form input:focus {
        border-color: #4f46e5;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.10);
    }

    .login-form input::placeholder {
        color: #a1a8b5;
    }

    .login-form .helptext {
        display: block;
        font-size: 12px;
        color: #8b93a3;
        margin-top: 6px;
    }

    .login-form ul.errorlist {
        list-style: none;
        padding: 0;
        margin: 6px 0 0;
        color: #dc2626;
        font-size: 13px;
    }

    .login-button {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
        margin-top: 5px;
    }

    .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(37, 99, 235, 0.30);
        color: white;
    }

    .login-button:active {
        transform: translateY(0);
    }

    .login-footer {
        text-align: center;
        margin-top: 25px;
        color: #8a93a3;
        font-size: 13px;
    }

    .brand-text {
        font-weight: 700;
        color: #4f46e5;
    }

    @media (max-width: 576px) {
        .login-page {
            min-height: calc(100vh - 60px);
            padding: 25px 15px;
        }

        .login-card {
            padding: 32px 22px;
            border-radius: 18px;
        }

        .login-icon {
            width: 62px;
            height: 62px;
            font-size: 26px;
            border-radius: 17px;
        }

        .login-title {
            font-size: 24px;
        }
    }
</style>

<div class="login-page">
    <div class="login-wrapper">

        <div class="login-card">

            <!-- Login Icon -->
            <div class="login-icon">
                💬
            </div>

            <!-- Heading -->
            <h1 class="login-title">Welcome Back</h1>

            <p class="login-subtitle">
                Sign in to continue chatting with your community
            </p>

            <!-- Login Form -->
            <form method="post" class="login-form">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="login-button">
                    Log In
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                Securely connect with <span class="brand-text">ChatApp</span>
            </div>

        </div>

    </div>
</div>

{% endblock %}
